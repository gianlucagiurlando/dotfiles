# ============ SINGLE SOURCE OF TRUTH ============
# Edit hex values here. Run ./sync-colors.sh to regenerate
# terminal/p10k/colors.zsh and terminal/wezterm/colors.lua

# Set to "custom" to use the hex palette below
# Or set to any WezTerm built-in theme name e.g. "Dracula (Official)"
theme: "Dracula (Official)"

palette:
  background:   { hex: "#011423" }
  foreground:   { hex: "#CBE0F0" }
  cursor:       { hex: "#47FF9C" }
  cursor_fg:    { hex: "#011423" }
  selection_bg: { hex: "#033259" }
  selection_fg: { hex: "#CBE0F0" }

  black:        { hex: "#214969", ansi: 0,  xterm256: 0   }
  red:          { hex: "#E52E2E", ansi: 1,  xterm256: 196 }
  green:        { hex: "#44FFB1", ansi: 2,  xterm256: 76  }
  yellow:       { hex: "#FFE073", ansi: 3,  xterm256: 178 }
  blue:         { hex: "#0FC5ED", ansi: 4,  xterm256: 31  }
  magenta:      { hex: "#A277FF", ansi: 5,  xterm256: 208 }
  cyan:         { hex: "#24EAF7", ansi: 6,  xterm256: 66  }
  white:        { hex: "#24EAF7", ansi: 7,  xterm256: 101 }

  bright_black:   { hex: "#214969", ansi: 8  }
  bright_red:     { hex: "#E52E2E", ansi: 9  }
  bright_green:   { hex: "#44FFB1", ansi: 10 }
  bright_yellow:  { hex: "#FFE073", ansi: 11 }
  bright_blue:    { hex: "#A277FF", ansi: 12 }
  bright_magenta: { hex: "#a277ff", ansi: 13 }
  bright_cyan:    { hex: "#24EAF7", ansi: 14 }
  bright_white:   { hex: "#24EAF7", ansi: 15 }

prompt:
  directory:    { role: blue    }
  dir_anchor:   { role: cyan    }
  git_clean:    { role: green   }
  git_modified: { role: yellow  }
  prompt_ok:    { role: green   }
  prompt_error: { role: red     }
  time:         { role: cyan    }
  exec_time:    { role: yellow  }
  aws:          { role: magenta }
