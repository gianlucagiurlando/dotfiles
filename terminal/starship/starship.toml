"$schema" = 'https://starship.rs/config-schema.json'


format = """
[](surface0)\
$os\
$username${custom.machine}\
[](bg:peach fg:surface0)\


${custom.smart_directory}\
${custom.fallback_directory}\



[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:blue bg:purple)\
$docker_context\
$cmd_duration\
[](fg:purple bg:purple)\
$time\
[ ](fg:purple)\
$line_break$character"""


palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = true
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[custom.machine]
command = "if [ \"$(uname)\" = \"Darwin\" ]; then echo mac; else echo vps; fi"
when = true
style = "bg:surface0 fg:text"
format = '[on $output ]($style)'


# [directory]
# style = "fg:mantle bg:peach"
# format = "[ $path ]($style)"
# truncation_length = 1
# truncation_symbol = ""

[custom.smart_directory]
command = '''
repo_root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 1

repo_name="$(basename "$repo_root")"
current="$(pwd)"

if [ "$current" = "$repo_root" ]; then
    printf "%s" "$repo_name"
    exit 0
fi

relative="${current#"$repo_root"/}"
leaf="${relative##*/}"

if [ "$relative" = "$leaf" ]; then
    printf "%s/%s" "$repo_name" "$leaf"
    exit 0
fi

middle="${relative%/*}"
count=$(printf "%s" "$middle" | awk -F/ '{print NF}')
dots=$(printf '%*s' "$count" '' | tr ' ' '.')

printf "%s/%s/%s" "$repo_name" "$dots" "$leaf"
'''

when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:mantle bg:peach"
format = "[ $output ]($style)"


[custom.fallback_directory]
command = '''
if [ "$PWD" = "$HOME" ]; then
    printf "~"
else
    basename "$PWD"
fi
'''

when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:mantle bg:peach"
format = "[ $output ]($style)"




[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'

[git_status]

style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:base bg:green)]($style)'
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"

[nodejs]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[java]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[kotlin]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[python]
symbol = ""
style = "bg:blue"
version_format = "${major}.${minor}"
format = '[[ $symbol( $version)( ($virtualenv)) ](fg:base bg:blue)]($style)'

[docker_context]
symbol = ""
style = "bg:mantle"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[cmd_duration]
min_time = 500
format = '[[  took $duration ](fg:base bg:purple)]($style)'
style = "bg:purple"

[time]
disabled = true
time_format = "%R"
style = "bg:peach"
format = '[[$time ](fg:mantle bg:purple)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:creen)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'
